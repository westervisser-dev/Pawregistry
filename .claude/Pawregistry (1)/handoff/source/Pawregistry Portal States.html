// ─── Journey tracker (mini) ───────────────────────────────────────────────────
function MiniJourney({ stageIdx }) {
  const labels = ['Enquired','Approved','Waitlist','Reserved','Booked','Home'];
  return (
    <div className="relative">
      <div className="absolute left-[10px] right-[10px] top-[9px] h-[2px] bg-warm-200 rounded-full" />
      <div className="absolute left-[10px] top-[9px] h-[2px] rounded-full"
           style={{ width: `calc((100% - 20px) * ${stageIdx/5})`, background: '#c47420' }} />
      <div className="relative grid grid-cols-6 gap-0.5">
        {labels.map((l, i) => {
          const done = i < stageIdx, active = i === stageIdx;
          return (
            <div key={l} className="flex flex-col items-center text-center">
              <span className="w-[18px] h-[18px] rounded-full flex items-center justify-center border-[1.5px] mb-1.5"
                    style={{ background: done||active?'#c47420':'#fff', borderColor: done||active?'#c47420':'#d6c9b8',
                             boxShadow: active?'0 0 0 3px rgba(196,116,32,0.18)':'none' }}>
                {done && <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round"><path d="M5 12.5l4 4 10-10"/></svg>}
                {active && <span className="w-[5px] h-[5px] rounded-full bg-white"/>}
              </span>
              <span className={`text-[8.5px] leading-tight ${active||done?'text-warm-900 font-medium':'text-warm-400'}`}>{l}</span>
            </div>

}

// ─── Info card (lower half) ───────────────────────────────────────────────────
function StageInfoCard({ stage }) {
  const D = window.PAW_DATA;
  if (stage.heroKind === 'completed') {
    return (
      <div className="rounded-[10px] border border-black/[0.05] bg-white px-4 py-3.5">
        <div className="text-[10px] uppercase tracking-[0.1em] text-warm-500 mb-2">Memories</div>
        <div className="grid grid-cols-3 gap-1.5">
          <PlaceholderLocal label="" className="aspect-square rounded-[6px]" tone="warm"/>
          <PlaceholderLocal label="" className="aspect-square rounded-[6px]"/>
          <PlaceholderLocal label="" className="aspect-square rounded-[6px]" tone="warm"/>
        </div>
        <p className="text-[10px] text-warm-500 mt-3 italic">"Rust settled in immediately. Thank you Sarah!" — Claire</p>
      </div>
    );
  }
  if (stage.puppyId) {
    const total = 28000, paid = stage.paidAmount, remaining = total - paid, pct = Math.round((paid/total)*100);
    return (
      <div className="rounded-[10px] border border-black/[0.05] bg-white px-4 py-3.5">
        <div className="flex items-center justify-between mb-2">
          <div className="text-[10px] uppercase tracking-[0.1em] text-warm-500">Payments</div>
          <div className="text-[9.5px] text-warm-400">{pct}%</div>
        </div>
        <div className="flex items-baseline justify-between mb-2">
          <div className="font-serif text-[18px] text-warm-900 leading-none">{D.ZAR(paid)}</div>
          <div className="text-[10px] text-warm-500">of {D.ZAR(total)}</div>
        </div>
        <div className="h-[5px] bg-warm-100 rounded-full overflow-hidden">
          <div className="h-full rounded-full" style={{ width: pct+'%', background: 'linear-gradient(90deg,#d98e3a,#c47420)' }}/>
        </div>
        <div className="text-[10px] text-warm-500 mt-2.5">
          {remaining > 0 ? `Final R${(remaining/1000).toFixed(0)}k due by 25 Apr` : 'Paid in full — enjoy Saturday!'}
        </div>
      </div>
    );
  }
  // No puppy — show deposit status (or empty)
  if (stage.depositPaid) {
    return (
      <div className="rounded-[10px] border border-black/[0.05] bg-white px-4 py-3.5">
        <div className="flex items-center justify-between mb-2">
          <div className="text-[10px] uppercase tracking-[0.1em] text-warm-500">Deposit</div>
          <span className="text-[9px] px-1.5 py-0.5 rounded-full font-medium" style={{ background: '#e4ebe0', color: '#3e5a2a' }}>Paid</span>
        </div>
        <div className="flex items-center gap-2.5">
          <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: '#e4ebe0' }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3e5a2a" strokeWidth="2" strokeLinecap="round"><path d="M5 12.5l4 4 10-10"/></svg>
          </div>
          <div>
            <div className="font-serif text-[17px] text-warm-900 leading-none">{D.ZAR(stage.paidAmount)}</div>
            <div className="text-[10px] text-warm-500 mt-0.5">{stage.depositTier === 'r5000' ? 'Secured tier' : 'Standard tier'}</div>
          </div>
        </div>
      </div>
    );
  }
  // No deposit yet — show next step
  return (
    <div className="rounded-[10px] border border-black/[0.05] bg-white px-4 py-3.5">
      <div className="text-[10px] uppercase tracking-[0.1em] text-warm-500 mb-2">What’s next</div>
      <p className="text-[11px] text-warm-700 leading-relaxed">{stage.nextStep}</p>
    </div>
  );
}

// ─── Placeholder (local, simplified version of ui.jsx's) ──────────────────────
function PlaceholderLocal({ label = '', className = '', tone = 'warm' }) {
  const toneMap = {
    warm: { a: '#ede5d8', b: '#e1d4c0', text: '#8a7560' },
    dark: { a: '#3d2510', b: '#2d1808', text: '#b5a090' },
  };
  const { a, b, text } = toneMap[tone] || toneMap.warm;
  const bg = `repeating-linear-gradient(135deg, ${a} 0 12px, ${b} 12px 24px)`;
  return (
    <div className={`flex items-center justify-center ${className}`} style={{ background: bg }}>
      {label && <span style={{ fontFamily: 'ui-monospace, monospace', fontSize: 9, color: text, letterSpacing: '0.06em', textTransform: 'uppercase' }}>{label}</span>}
    </div>
  );
}

        {['Home','Litters','Updates','Payments','Docs'].map((l,i) => (
          <div key={l} className="flex items-center justify-center">
            <span className="text-[9px]" style={{ color: i===0?'#c47420':'#9e8b78', fontWeight: i===0?600:400 }}>{l}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function greeting(s) {
  if (s.key === 'enquired')   return `Hi ${s.name.split(' ')[0]}.`;
  if (s.key === 'approved')   return `Welcome aboard, ${s.name.split(' ')[0]}.`;
  if (s.key === 'waitlisted') return `Still waiting, ${s.name.split(' ')[0]} — good news coming.`;
  if (s.key === 'reserved')   return `Don\'t miss your window, ${s.name.split(' ')[0]}.`;
  if (s.key === 'booked')     return `${s.daysLeft} days to go, ${s.name.split(' ')[0]}.`;
  if (s.key === 'fully_paid') return `Pickup week, ${s.name.split(' ')[0]}!`;
  if (s.key === 'completed')  return `Hi ${s.name.split(' ')[0]} — missing Rust?`;
  return 'Welcome.';
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  return (
    <DesignCanvas>
      <div style={{ padding: '0 60px 20px', maxWidth: 1400 }}>
        <div style={{ fontSize: 28, fontWeight: 600, letterSpacing: -0.4, color: '#2a2520', fontFamily: 'var(--font-serif)' }}>
          Client lifecycle — all 7 states
        </div>
        <div style={{ fontSize: 13, color: 'rgba(60,50,40,0.6)', marginTop: 6, maxWidth: 640, lineHeight: 1.5 }}>
          How the portal home screen adapts to each stage of the client's journey, from first enquiry through home delivery. Each artboard is a scaled frame of the same dashboard, with hero, journey tracker, and supporting card all rebuilt per stage.
        </div>
      </div>

      <DCSection title="Pre-match" subtitle="Before a puppy is assigned — focus is on status, expectations, and next steps." gap={40}>
        {STAGES.slice(0, 3).map(s => (
          <DCArtboard key={s.key} label={s.label}>
            <PhoneArtboard stage={s}/>
          </DCArtboard>
        ))}
      </DCSection>

      <DCSection title="Matched" subtitle="Client has a specific puppy — focus shifts to payments and the countdown." gap={40}>
        {STAGES.slice(3, 6).map(s => (
          <DCArtboard key={s.key} label={s.label}>
            <PhoneArtboard stage={s}/>
          </DCArtboard>
        ))}
      </DCSection>

      <DCSection title="Post-delivery" subtitle="Puppy is home — portal transitions to an alumni / photo-sharing mode." gap={40}>
        {STAGES.slice(6).map(s => (
          <DCArtboard key={s.key} label={s.label}>
            <PhoneArtboard stage={s}/>
          </DCArtboard>
        ))}
        <DCPostIt top={-20} left={340} rotate={3} width={200}>
          Post-delivery is a gap in the real app today — this is a sketch of where it could go.
        </DCPostIt>
      </DCSection>

      <div style={{ height: 80 }}/>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
