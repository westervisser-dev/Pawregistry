<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pawregistry — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['"DM Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        serif: ['"DM Serif Display"', 'ui-serif', 'Georgia', 'serif'],
        mono: ['ui-monospace', 'SFMono-Regular', 'monospace'],
      },
      colors: {
        brand: { 50:'#fdf6ee',100:'#f8e8d0',200:'#f0cfa0',300:'#e4ae68',400:'#d98e3a',500:'#c47420',600:'#a35c17',700:'#824614',800:'#633310',900:'#45220a' },
        warm:  { 50:'#faf8f5',100:'#f5f0e8',200:'#ede5d8',300:'#d6c9b8',400:'#b5a090',500:'#9e8b78',600:'#7a6a58',700:'#5a3e28',800:'#3d2510',900:'#1e0e04' },
        stone: { 50:'#fafaf9',100:'#f5f5f4',200:'#e7e5e4',300:'#d6d3d1',400:'#a8a29e',500:'#78716c',600:'#57534e',700:'#44403c',800:'#292524',900:'#1c1917' },
      },
    },
  },
};
</script>
<style>
:root {
  --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --font-serif: "DM Serif Display", ui-serif, Georgia, serif;
}
html, body { background: #f5f0e8; color: #1e0e04; font-family: var(--font-sans); letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; }
body { margin: 0; }
h1, h2, h3 { font-family: var(--font-serif); font-weight: 400; letter-spacing: 0; }
.font-serif { font-family: var(--font-serif); }
.font-sans { font-family: var(--font-sans); }
::selection { background: #f8e8d0; color: #45220a; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #d6c9b8; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #b5a090; }
::-webkit-scrollbar-track { background: transparent; }
input:focus { outline: none; }

/* Tweaks panel */
.tweaks-panel { position: fixed; bottom: 20px; right: 20px; z-index: 60; background: white; border: 1px solid #ede5d8; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.12); padding: 14px 16px; width: 260px; font-family: var(--font-sans); display: none; }
.tweaks-panel.open { display: block; }
.tweaks-panel h4 { font-family: var(--font-sans); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #7a6a58; margin: 0 0 10px; }
.tweaks-panel label { display: block; font-size: 12px; color: #3d2510; margin-bottom: 8px; }
.tweaks-panel select { width: 100%; padding: 6px 8px; border: 1px solid #ede5d8; border-radius: 8px; font-size: 12px; background: #faf8f5; margin-top: 4px; }
.tweaks-panel input[type=color] { width: 100%; height: 28px; border: 1px solid #ede5d8; border-radius: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="./data.js"></script>
<script type="text/babel" src="./components/ui.jsx"></script>
<script type="text/babel" src="./components/shell.jsx"></script>
<script type="text/babel" src="./screens/dashboard.jsx"></script>
<script type="text/babel" src="./screens/clients.jsx"></script>
<script type="text/babel" src="./screens/other.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#949494",
  "density": "comfortable",
  "background": "#f5f0e8"
}/*EDITMODE-END*/;

function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('paw-nav') || 'null'); } catch(e) { return null; } })();
  const [route, setRoute] = useState(saved?.route || 'dashboard');
  const [openClient, setOpenClient] = useState(saved?.openClient || null);
  const [openLitter, setOpenLitter] = useState(saved?.openLitter || null);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAKS_DEFAULTS);

  useEffect(() => {
    localStorage.setItem('paw-nav', JSON.stringify({ route, openClient, openLitter }));
  }, [route, openClient, openLitter]);

  // Tweak mode integration
  useEffect(() => {
    const handler = (e) => {
      const t = e.data?.type;
      if (t === '__activate_edit_mode') setTweaksOpen(true);
      if (t === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  useEffect(() => {
    document.body.style.background = tweaks.background;
    document.documentElement.style.setProperty('--accent', tweaks.accentColor);
  }, [tweaks]);

  function navigate(r) {
    setRoute(r);
    setOpenClient(null);
    setOpenLitter(null);
    window.scrollTo({ top: 0 });
  }

  const titleMap = {
    dashboard: 'Dashboard',
    litters:   openLitter ? 'Litter detail' : 'Litters',
    clients:   openClient ? 'Client detail' : 'Clients',
    waitlist:  'Waitlist',
    payments:  'Payments',
    updates:   'Updates',
    documents: 'Documents',
  };

  let content;
  if (route === 'dashboard') content = <DashboardScreen onNavigate={navigate} />;
  else if (route === 'clients' && openClient) content = <ClientDetailScreen clientId={openClient} onBack={() => setOpenClient(null)} onNavigate={navigate} />;
  else if (route === 'clients') content = <ClientsScreen onOpenClient={setOpenClient} />;
  else if (route === 'litters' && openLitter) content = <LitterDetailScreen litterId={openLitter} onBack={() => setOpenLitter(null)} onOpenClient={(id) => { setRoute('clients'); setOpenClient(id); setOpenLitter(null); }} />;
  else if (route === 'litters') content = <LittersScreen onOpenLitter={setOpenLitter} />;
  else if (route === 'waitlist') content = <WaitlistScreen onOpenClient={(id) => { setRoute('clients'); setOpenClient(id); }} />;
  else if (route === 'payments') content = <PaymentsScreen onOpenClient={(id) => { setRoute('clients'); setOpenClient(id); }} />;
  else content = <EmptyScreen name={titleMap[route]} />;

  return (
    <div className="min-h-screen flex" style={{ background: tweaks.background }}>
      <Sidebar route={route} onNavigate={navigate} />
      <div className="flex-1 flex flex-col min-w-0">
        <TopBar title={titleMap[route]} />
        <main className="flex-1 min-w-0">{content}</main>
      </div>
      <div className={`tweaks-panel ${tweaksOpen ? 'open' : ''}`}>
        <h4>Tweaks</h4>
        <label>Accent colour
          <input type="color" value={tweaks.accentColor}
                 onChange={e => setTweaks(t => ({ ...t, accentColor: e.target.value }))}
                 onBlur={e => window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accentColor: e.target.value } }, '*')} />
        </label>
        <label>Background
          <select value={tweaks.background}
                  onChange={e => { const v = e.target.value; setTweaks(t => ({ ...t, background: v })); window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { background: v } }, '*'); }}>
            <option value="#f5f0e8">Warm cream (default)</option>
            <option value="#faf8f5">Soft ivory</option>
            <option value="#ede5d8">Sand</option>
            <option value="#f5f5f4">Neutral stone</option>
          </select>
        </label>
        <label>Jump to screen
          <select value={openClient ? 'client-detail' : openLitter ? 'litter-detail' : route}
                  onChange={e => {
                    const v = e.target.value;
                    if (v === 'client-detail') { setRoute('clients'); setOpenClient('c-003'); setOpenLitter(null); }
                    else if (v === 'litter-detail') { setRoute('litters'); setOpenLitter('l-wren'); setOpenClient(null); }
                    else navigate(v);
                  }}>
            <option value="dashboard">Dashboard</option>
            <option value="clients">Clients list</option>
            <option value="client-detail">Client detail (Marius J.)</option>
            <option value="litters">Litters</option>
            <option value="litter-detail">Litter detail (Wren)</option>
            <option value="waitlist">Waitlist</option>
            <option value="payments">Payments</option>
          </select>
        </label>
        <p style={{ fontSize: 11, color: '#9e8b78', marginTop: 10, marginBottom: 0 }}>Toggle Tweaks from the toolbar.</p>
      </div>
    </div>
  );
}

function EmptyScreen({ name }) {
  return (
    <div className="p-10 max-w-[900px]">
      <PageHeader title={name} subtitle={`${name} surface — not part of this exploration.`} />
      <Card>
        <div className="px-[22px] py-14 text-center">
          <div className="mx-auto w-12 h-12 rounded-full bg-warm-100 flex items-center justify-center mb-3">
            <Glyph shape="paw" color="#9a8871" size={22} />
          </div>
          <p className="text-[13px] text-warm-600">This screen wasn't in the design scope.</p>
          <p className="text-[12px] text-warm-400 mt-1">Focus was Dashboard, Clients, Litters, Waitlist, Payments.</p>
        </div>
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
